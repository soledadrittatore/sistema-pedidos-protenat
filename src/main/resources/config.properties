# Datos de conexión a la base bd_protenat.
# Si existe un archivo config.properties en la carpeta desde donde se ejecuta
# la aplicación, se usa ese en lugar de este.
db.url=jdbc:mysql://127.0.0.1:3306/bd_protenat?useSSL=false&allowPublicKeyRetrieval=true
db.usuario=protenat_app
db.clave=protenat123

# Escala de las ventanas y letras. En Linux con pantallas de alta resolución
# usar 1.5 o 2; en Windows dejar 1 (Windows ya escala solo).
ui.escala=1
